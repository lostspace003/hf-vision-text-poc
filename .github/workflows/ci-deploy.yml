name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax check
        run: python -m py_compile space/app.py space/utils.py scripts/deploy_space.py
      - name: Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: JavaScript unit tests
        run: node --test tests/utils.test.mjs

  deploy-space:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      space_id: ${{ steps.deploy.outputs.space_id }}
      hardware: ${{ steps.deploy.outputs.hardware }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.28.1,<1.0"
      - id: deploy
        name: Deploy Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/deploy_space.py

  deploy-pages:
    needs: [test, deploy-space]
    # Publish the UI even if the Space deploy failed (e.g. secret not set yet)
    if: always() && github.event_name != 'pull_request' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write backend config
        if: needs.deploy-space.outputs.space_id != ''
        run: |
          printf '{\n  "spaceId": "%s",\n  "hardware": "%s"\n}\n' \
            "${{ needs.deploy-space.outputs.space_id }}" "${{ needs.deploy-space.outputs.hardware }}" > web/config.json
          cat web/config.json
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          enable_jekyll: false
